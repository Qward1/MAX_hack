# Журналы контейнеров ограничены по объёму: не больше 5 файлов по 10 МБ на
# контейнер (json-file), старые файлы Docker удаляет сам. Полных IP-адресов в
# журналах нет: доступ журналирует приложение с усечённой сетью клиента.
x-logging: &production-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  db:
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    restart: unless-stopped
    logging: *production-logging

  migrate:
    environment: &production-environment
      APP_ENV: production
      DATABASE_URL: postgresql+asyncpg://domsignal:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/domsignal
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET}
      AUTH_MFA_ENCRYPTION_KEY: ${AUTH_MFA_ENCRYPTION_KEY:?set AUTH_MFA_ENCRYPTION_KEY}
      ALLOW_TEST_SESSION: "false"
      DEMO_SEED: "false"
      MAX_TRANSPORT: webhook
      MAX_BOT_TOKEN: ${MAX_BOT_TOKEN:?set MAX_BOT_TOKEN}
      MAX_BOT_USERNAME: t480_hakaton_max_bot
      MAX_WEBHOOK_SECRET: ${MAX_WEBHOOK_SECRET:?set MAX_WEBHOOK_SECRET}
      MAX_API_BASE_URL: https://platform-api2.max.ru
      MAX_API_TIMEOUT_SECONDS: ${MAX_API_TIMEOUT_SECONDS:-5}
      CHAT_CONNECTION_TTL_SECONDS: ${CHAT_CONNECTION_TTL_SECONDS:-900}
      # Модель вызывает только ai-worker (задачи ai.*); остальные процессы
      # разбирают правилами и ключа не получают — см. ai-worker ниже.
      LLM_PROVIDER: rules
      # Пассивное чтение выключено по умолчанию; для показа тишину окна задают явно.
      PASSIVE_CAPTURE_ENABLED: ${PASSIVE_CAPTURE_ENABLED:-false}
      # Модель в разборе окон чата (P6-DECISION); false — правила, /report с моделью.
      PASSIVE_LLM_ENABLED: ${PASSIVE_LLM_ENABLED:-true}
      PASSIVE_WINDOW_SILENCE_SECONDS: ${PASSIVE_WINDOW_SILENCE_SECONDS:-120}
      # Окно не длиннее 6 реплик — частное ограничение §6.3 (p95 7,5 с > 6 с),
      # OWNER-DECISION-2026-09-24.
      PASSIVE_WINDOW_MAX_LINES: ${PASSIVE_WINDOW_MAX_LINES:-6}
      PASSIVE_DANGER_GROUP_MINUTES: ${PASSIVE_DANGER_GROUP_MINUTES:-30}
      PASSIVE_CHAT_MEMO_PAUSE_MINUTES: ${PASSIVE_CHAT_MEMO_PAUSE_MINUTES:-30}
      PASSIVE_ANALYSIS_FALLBACK_SECONDS: ${PASSIVE_ANALYSIS_FALLBACK_SECONDS:-90}
      # Время в сообщениях сотрудникам — в поясе показа, подпись «МСК».
      DISPLAY_TIMEZONE: ${DISPLAY_TIMEZONE:-Europe/Moscow}
      # D5: пул соединений на процесс. Один VPS: api + worker + ai-worker ×
      # (5 + 10) = 45 < max_connections 100 (docs/SCALING.md).
      DB_POOL_SIZE: ${DB_POOL_SIZE:-5}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-10}
      # D3: сопровождение обращения, сводка сотрудникам, ночное окно личных рассылок.
      APPEAL_FOLLOWUP_DAYS: ${APPEAL_FOLLOWUP_DAYS:-14}
      DAILY_DIGEST_HOUR_MSK: ${DAILY_DIGEST_HOUR_MSK:-9}
      BROADCAST_DM_QUIET_HOURS: ${BROADCAST_DM_QUIET_HOURS:-22:00-08:00}
      # D4: контакт по вопросам данных на /privacy; пусто — ссылка на страницу продукта.
      PRIVACY_CONTACT: ${PRIVACY_CONTACT:-}
      # F1 §5.5: токен самопроверки витрины жюри (scripts/showcase_check.py,
      # uptime.yml); пусто — /api/v1/showcase/health отвечает 404.
      SHOWCASE_CHECK_TOKEN: ${SHOWCASE_CHECK_TOKEN:-}
      # Финал: жюри входит из одной сети и под разными ролями — порог 30 попыток
      # за 5 минут на логин и 30 новых входов с адреса (по умолчанию 10). Пароль
      # от 12 символов + TOTP; на адрес в целом — ×5.
      AUTH_RATE_THRESHOLD: ${AUTH_RATE_THRESHOLD:-30}
      PUBLIC_BASE_URL: https://${PUBLIC_DOMAIN:?set PUBLIC_DOMAIN}
      CORS_ORIGINS: https://${PUBLIC_DOMAIN:?set PUBLIC_DOMAIN}
    logging: *production-logging

  seed:
    environment: *production-environment
    logging: *production-logging

  api:
    # Only Caddy (private Docker network) or trusted host loopback reaches this port.
    # Журнал доступа uvicorn выключен: он пишет полный адрес клиента из
    # X-Forwarded-For. Запросы журналирует приложение (`http_request`).
    command: ["uvicorn", "domsignal.main:app", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers", "--forwarded-allow-ips", "*", "--no-access-log"]
    environment:
      <<: *production-environment
      BUILD_COMMIT: ${BUILD_COMMIT:?set BUILD_COMMIT}
      # Возможность разбора моделью объявляется по провайдеру AI-пула — без ключа.
      AI_POOL_LLM_PROVIDER: ${LLM_PROVIDER:-rules}
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=2)",
        ]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 5
    logging: *production-logging

  worker:
    environment:
      <<: *production-environment
      # `/version` личного бота отвечает из операционного пула (D1).
      BUILD_COMMIT: ${BUILD_COMMIT:?set BUILD_COMMIT}
      OPERATIONAL_WORKER_CONCURRENCY: ${OPERATIONAL_WORKER_CONCURRENCY:-1}
    logging: *production-logging

  ai-worker:
    environment:
      <<: *production-environment
      # Единственный процесс с ключом модели. По умолчанию — правила без ключа;
      # openai_compatible без ключа или модели не проходит проверку настроек.
      LLM_PROVIDER: ${LLM_PROVIDER:-rules}
      # M1: Cloud.ru Evolution Foundation Models (LLM-PROVIDER-2026-09-27).
      LLM_BASE_URL: ${LLM_BASE_URL:-https://foundation-models.api.cloud.ru/v1}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      # Пусто — таймаут из профиля модели (models.v1.yaml);
      # непустое значение перекрывает профиль (OWNER-DECISION-2026-09-24).
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-}
      LLM_DAILY_CALL_BUDGET: ${LLM_DAILY_CALL_BUDGET:-300}
      LLM_CHAT_DAILY_SHARE: ${LLM_CHAT_DAILY_SHARE:-0.2}
      # F1 (LLM-RATE-2026-09-29): токенов в минуту на все процессы — 80 % лимита ключа Cloud.ru.
      LLM_TOKENS_PER_MINUTE: ${LLM_TOKENS_PER_MINUTE:-80000}
      # Аренда задачи AI-пула ≥ таймаут модели + 20 с, иначе воркер не стартует.
      AI_WORKER_LEASE_SECONDS: ${AI_WORKER_LEASE_SECONDS:-80}
      # D5: параллельные вызовы модели в процессе, не больше LLM_MAX_CONCURRENCY (4).
      AI_WORKER_CONCURRENCY: ${AI_WORKER_CONCURRENCY:-2}
    logging: *production-logging

  caddy:
    image: caddy:2.10.2-alpine
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:?set PUBLIC_DOMAIN}
    networks:
      default:
        aliases:
          - ${PUBLIC_DOMAIN:?set PUBLIC_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    logging: *production-logging

volumes:
  caddy-data:
  caddy-config:
