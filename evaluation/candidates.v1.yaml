# Кандидаты отбора моделей P2 — вход скрипта `evaluation/select_models.py`.
#
# Правило допуска (целевая архитектура v3 §12, задание P2 §2): в отбор
# попадают только модели у провайдеров и в режимах API, где переданные данные
# **не используются для обучения моделей**. Исключены: DeepSeek и
# OpenInference (polza относит их к «возможно обучение на данных» и «нет
# гарантий»), бесплатные, экспериментальные и preview-модели, а также
# бесплатные уровни провайдеров.
#
# Основание у каждой модели — страница polza.ai «Конфиденциальность»
# (https://polza.ai/docs/osobennosti/privacy) плюс поля каталога моделей
# polza (`GET https://polza.ai/api/v1/models`): `stores_data_in_russia`,
# `is_fz152_compliant`, `top_provider.name`, `top_provider.pricing`,
# `top_provider.supported_parameters`. Дата проверки — у каждой записи.
# Политики вышестоящих провайдеров отдельно не открывались: для пилота это
# отдельный gate выбора провайдера (§12), здесь — только синтетика.
#
# Цены — рубли за миллион токенов, из каталога polza на дату проверки.
version: v1
checked_at: 2026-09-20
policy_source: https://polza.ai/docs/osobennosti/privacy
catalog_source: https://polza.ai/api/v1/models
excluded_providers:
  - id: deepseek
    reason: polza — «возможно обучение на данных»
  - id: open-inference
    reason: polza — «нет гарантий» по использованию данных
excluded_classes:
  - бесплатные и free-уровни провайдеров
  - модели с суффиксом preview и экспериментальные сборки

candidates:
  - id: openai/gpt-5-nano
    label: GPT-5 nano
    upstream: openai (режим flex)
    schema_mode: json_schema_strict
    max_tokens: 1600
    timeout_seconds: 25
    temperature: null            # семейство gpt-5 принимает только значение по умолчанию
    extra_body:
      reasoning:
        effort: low
    price_in_per_million: 2.95
    price_out_per_million: 23.62
    stores_data_in_russia: false
    policy_basis: >-
      polza «Конфиденциальность»: запросы у агрегатора не сохраняются, OpenAI
      хранит до 30 дней; в список «могут использовать данные для обучения» не
      входит.
    policy_checked_at: 2026-09-20

