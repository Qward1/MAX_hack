[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "domsignal"
version = "0.1.0"
description = "Architectural walking skeleton for DomSignal"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "alembic>=1.14,<2",
  "argon2-cffi>=25.1,<26",
  "asyncpg>=0.30,<1",
  "cryptography>=46,<49",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "jsonschema>=4.23,<5",
  "pydantic-settings>=2.7,<3",
  "pyotp>=2.9,<3",
  "pyyaml>=6.0,<7",
  "qrcode>=8,<9",
  "sqlalchemy[asyncio]>=2.0.36,<3",
  "tzdata>=2025.2",
  "uvicorn[standard]>=0.34,<1",
]

[dependency-groups]
dev = [
  "mypy>=1.14,<2",
  "pymorphy3>=2,<3",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "ruff>=0.9,<1",
  "types-qrcode>=8.2.0.20260518",
]

[tool.hatch.build.targets.wheel]
packages = ["src/domsignal"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
markers = [
  "integration: requires a real PostgreSQL database",
]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = ["miniapp", "docs/openapi.json"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
packages = ["domsignal"]
