# Таксономия подтипов проблем дома, редакция v2.
#
# Подтип — стабильный код, общий для AI и продукта. Здесь НЕТ маршрутов,
# организаций, телефонов, каналов и сроков: ответственность определяет
# детерминированный Responsibility Router по проверенному справочнику
# (docs/decisions.md#passive-chat-2026-09-20).
#
# Поля подтипа:
#   code             стабильный код (не переименовывать без среза миграции)
#   product_category один из пяти кодов ReportCategory — категория заявки УК,
#                    если заявку всё-таки создаёт УК; это НЕ утверждение о том,
#                    что проблема входит в зону ответственности УК
#   dedupe_scope     object — проблема конкретного объекта (лифт, подъезд);
#                    house — проблема уровня дома/двора
#   label            короткое название объекта по умолчанию
#   description      формулировка для промпта модели (P2)
#   patterns         список правил; подтип сработал, если сработало ЛЮБОЕ
#                    правило. Правило `all` — список групп основ; каждая
#                    группа должна совпасть хотя бы одной основой.
#   exclude          основы, любая из которых отменяет срабатывание
#   danger_kind      необязательно: вид опасности, который сам называет этот
#                    подтип. Сигнал с этой опасностью и подтипом
#                    other.unspecified получает этот подтип, если соответствие
#                    однозначно (P6c: газ после разбора был «Другое»). Это
#                    классификация, не маршрут.
#
# Совпадение основы — только с начала слова (урок E0: «вод» внутри
# «мусоропровод», «доводчик», «провод»). Порядок подтипов задаёт приоритет:
# при нескольких совпадениях внутри одной product_category остаётся первый.
version: v2
subtypes:
  - code: gas.smell
    product_category: other
    dedupe_scope: house
    label: запах газа
    description: Запах газа, утечка газа в подъезде, квартире или на лестнице.
    danger_kind: gas
    patterns:
      - all:
          - [газ, газом, газа]
          - [пахнет, пахло, запах, чувству, воня, утечк, тянет, травит]
    exclude: [газон, газет]

  - code: gas.supply_outage
    product_category: other
    dedupe_scope: house
    label: газоснабжение
    description: Газ отключён или не подаётся.
    patterns:
      - all:
          - [газ, газом, газа, плит]
          - [отключ, нет, не подают, не подали, отсутств, без]
    exclude: [газон, газет]

  - code: elevator.button
    product_category: elevator
    dedupe_scope: object
    label: кнопка лифта
    description: Не работает кнопка вызова или кнопка этажа в лифте.
    patterns:
      - all:
          - [кнопк]
          - [лифт, вызова лифта, кабин]
          - [не работа, не нажим, залипа, не светит, запал]

  - code: elevator.doors
    product_category: elevator
    dedupe_scope: object
    label: двери лифта
    description: Двери лифта не закрываются, не открываются или зажимают.
    patterns:
      - all:
          - [лифт, кабин, подъемник]
          - [двер, створк]
          - [не закрыва, не откры, зажима, зажевыва, заклинил, не срабат]

  - code: elevator.stopped
    product_category: elevator
    dedupe_scope: object
    label: лифт
    description: Лифт не работает, стоит, не едет, не вызывается или неисправен.
    patterns:
      - all:
          - [лифт, кабин, подъемник]
          - [не работа, не еде, не ездит, не ходит, стоит, стоял, встал, сломал,
             не вызыв, не реагир, застрял, гудит, дергает, дребезж, умер,
             не спуска, не поднима, не приезжа, отключ, трясет]

  - code: roof.leak
    product_category: water
    dedupe_scope: object
    label: кровля
    description: Протечка с крыши, кровли или чердака.
    patterns:
      - all:
          - [крыш, кровл, чердак]
          - [течет, течь, протеч, капает, залива, подтека, дыр, прохудил]

  - code: water.leak
    product_category: water
    dedupe_scope: object
    label: протечка
    description: Течь, протечка, затопление в подъезде, подвале или квартире.
    patterns:
      - all:
          - [течет, течь, протеч, капает, подтека, прорвал, хлещет, залива,
             затопил, потоп, свищ]
      - all:
          - [труб, стояк, кран, вентил, смесител, унитаз, бачок]
          - [лопнул, сорвал, мокр, лужа, сырост, пятно, капл, подтек]
      - all:
          - [мокр, сыр, плесен, подтек]
          - [стен, потолк, углу, потолок]
    exclude: [трубк]

  - code: water.hot_outage
    product_category: water
    dedupe_scope: house
    label: горячая вода
    description: Нет горячей воды, отключено горячее водоснабжение.
    patterns:
      - all:
          - [горяч, гвс, кипятк, кипяток]
          - [нет, нету, отключ, отсутств, без, не дали, не подали, пропал,
             холодн, еле тепл]

  - code: water.supply_outage
    product_category: water
    dedupe_scope: house
    label: водоснабжение
    description: Нет холодной воды или воды вообще, отключено водоснабжение.
    patterns:
      - all:
          - [вод, хвс, водоснабж]
          - [нет, нету, отключ, отсутств, без, не дали, не подали, пропал]
    exclude: [магистрал, весь район, всем районе, всему району, районе]

  - code: water.quality
    product_category: water
    dedupe_scope: house
    label: качество воды
    description: Ржавая, мутная, грязная вода или вода с запахом.
    patterns:
      - all:
          - [вод, кран]
          - [ржав, мутн, грязн, бур, коричнев, желт, воня, с запахом, песок,
             осадок]

  - code: water.pressure
    product_category: water
    dedupe_scope: house
    label: напор воды
    description: Слабый напор воды или низкое давление в системе.
    patterns:
      - all:
          - [напор, давлени]
          - [слаб, низк, нет, пада, плох, еле, упал]

  - code: heating.cold_radiators
    product_category: other
    dedupe_scope: house
    label: отопление
    description: Холодные батареи, нет отопления, недотоп в квартирах и подъезде.
    patterns:
      - all:
          - [батаре, радиатор, отоплен, теплоснабж]
          - [холодн, ледян, нет, нету, не гре, не топ, чуть тепл, еле тепл,
             отключ, когда включ, не включ, не дали]

  - code: electrical.panel
    product_category: lighting
    dedupe_scope: object
    label: электрощит
    description: Неисправность электрощита или проводки, искрение, обрыв провода.
    patterns:
      - all:
          - [щиток, щитк, щите, проводк, провод, кабел, электрич, розетк,
             напряжен, автомат]
          - [искр, замыкан, дым, оборвал, оголен, бьет током, выбива, гори,
             треск, оплавил, коротит, вспышк]
    exclude: [мусоропровод, водопровод, газопровод]

  - code: power.grid_outage
    product_category: lighting
    dedupe_scope: house
    label: электроснабжение
    description: Отключение электроснабжения в доме, подъезде или районе.
    patterns:
      - all:
          - [электричеств, электроснабж, электроэнерг]
          - [нет, нету, отключ, отсутств, без, пропал, отключил]

  - code: street_lighting.failure
    product_category: lighting
    dedupe_scope: object
    label: уличное освещение
    description: Не горят фонари на улице, у остановки, вдоль дороги, в сквере.
    patterns:
      - all:
          - [фонар, освещен, свет]
          - [улиц, остановк, дорог, тротуар, проспект, сквер, парк, переулок,
             бульвар, алле]
          - [не горит, не горят, нет, перегорел, разбит, не работа, темно,
             погас, сломан, не включ]

  - code: lighting.yard
    product_category: lighting
    dedupe_scope: object
    label: освещение двора
    description: Не горит фонарь или светильник во дворе, у подъезда, на площадке.
    patterns:
      - all:
          - [фонар, освещен, свет, прожектор, светильник]
          - [двор, площадк, парковк, детск, у дома, у подъезда, у входа, газон]
          - [не горит, не горят, нет, перегорел, разбит, не работа, темно,
             погас, сломан, мигает, не включ]

  - code: lighting.stairwell
    product_category: lighting
    dedupe_scope: object
    label: освещение подъезда
    description: Нет света на лестнице, в тамбуре, на этаже, в подъезде или кабине.
    patterns:
      - all:
          - [свет, лампоч, ламп, освещен, плафон, светильник, фонар]
          - [не горит, не горят, нет, нету, перегорел, мигает, разбит,
             не работа, темно, тускл, погас, сгорел, без, не включ]
      - all:
          - [темно, темнот, потемк, глаз выколи, с фонарик, без света]

  - code: waste.chute
    product_category: waste
    dedupe_scope: object
    label: мусоропровод
    description: Мусоропровод забит, засорён, повреждён или горит.
    patterns:
      - all:
          - [мусоропровод, ствол]
          - [забит, засор, переполн, не работа, гори, завален, заварен, заклинил,
             вон, сломан]

  - code: waste.container_site
    product_category: waste
    dedupe_scope: house
    label: контейнерная площадка
    description: Переполненные баки, свалка и грязь на контейнерной площадке.
    patterns:
      - all:
          - [контейнер, бак, баки, площадк, помойк]
          - [переполн, полн, завален, свалк, горк, не убира, вон, мусор, крыс,
             раскидан, грязн]

  - code: waste.removal_regional
    product_category: waste
    dedupe_scope: house
    label: вывоз отходов
    description: Отходы не вывозят по графику регионального оператора.
    patterns:
      - all:
          - [мусор, тко, отход]
          - [не выво, не вывез, не вывоз, не забира, не увоз, не приезжа,
             не убира]
    exclude: [мусоропровод]

  - code: intercom.broken
    product_category: other
    dedupe_scope: object
    label: домофон
    description: Домофон не работает, не открывает дверь, трубка молчит.
    patterns:
      - all:
          - [домофон, трубк, видеодомофон, магнит]
          - [сломан, не работа, не откры, молчит, разбит, не пускает,
             не слыш, не отвеча, барахлит, не срабат]

  - code: entrance_door.broken
    product_category: other
    dedupe_scope: object
    label: дверь подъезда
    description: Дверь подъезда или тамбура не закрывается, сломан доводчик.
    patterns:
      - all:
          - [доводчик, двер, калитк, тамбурн, входн]
          - [не закрыва, сломан, не откры, разбит, не запира, хлопа,
             не держит, провис, оторва]
    exclude: [лифт, кабин, домофон]

  - code: cleaning.stairwell
    product_category: other
    dedupe_scope: house
    label: уборка подъезда
    description: Подъезд, лестница или тамбур не убираются, грязь и мусор.
    patterns:
      - all:
          - [грязн, не моют, не убира, не подмета, свалка в, паутин]
          - [подъезд, подьезд, лестниц, тамбур, этаж, лифт, площадке этажа,
             дом, доме]
    exclude: [снег, налед, двор]

  - code: snow.street
    product_category: other
    dedupe_scope: object
    label: уборка улицы
    description: Не убран снег или наледь на улице, тротуаре, у остановки.
    patterns:
      - all:
          - [снег, налед, гололед, сосульк, лед]
          - [улиц, тротуар, остановк, дорог, проспект, переход]
          - [не убира, не чист, не почист, не расчищ, скольз, завал, не пройти,
             не посыпа]

  - code: snow.yard
    product_category: other
    dedupe_scope: house
    label: уборка двора
    description: Не убран снег, наледь или сосульки во дворе и у подъезда.
    patterns:
      - all:
          - [снег, налед, гололед, сосульк, лед]
          - [не убира, не чист, не почист, не расчищ, скольз, завал, не пройти,
             не посыпа, висят, не сбива]

  - code: playground.damaged
    product_category: other
    dedupe_scope: object
    label: детская площадка
    description: Сломано или опасно оборудование детской или спортивной площадки.
    patterns:
      - all:
          - [качел, горк, песочниц, карусел, турник, лавочк, скамейк,
             спортивн]
          - [сломан, разбит, поврежд, опасн, торчит, шатает, развалил,
             оторва, гнил]

  - code: landscaping.public
    product_category: other
    dedupe_scope: object
    label: благоустройство
    description: "Благоустройство вне двора: газоны, деревья, урны, ограждения."
    patterns:
      - all:
          - [газон, клумб, дерев, кустарник, урн, ограждени, забор, куст]
          - [сломан, повален, вытопта, разбит, не убира, упал, поврежд,
             спилен, переполн]

  - code: road.damage
    product_category: other
    dedupe_scope: object
    label: дорожное покрытие
    description: Яма, выбоина, провал или разрушенное покрытие дороги и проезда.
    patterns:
      - all:
          - [дорог, проезд, асфальт, тротуар, покрыти, шоссе, проспект]
          - [яма, ямы, ям, выбоин, провал, разруш, разбит, трещин, просел,
             колдобин, не проехать]

  - code: structure.damage
    product_category: other
    dedupe_scope: object
    label: конструкции дома
    description: "Повреждение конструкций: стены, фасад, козырёк, ступени, перила."
    patterns:
      - all:
          - [стен, фасад, плит, балкон, козырек, ступен, перил, потолок,
             крыльц, отмостк]
          - [трещин, обрушил, рухнул, обвал, провалил, осыпа, отвалил,
             разрушил, шатает, падает]

  - code: external_network.outage
    product_category: other
    dedupe_scope: house
    label: внешние сети
    description: Авария на внешних сетях, отключение во всём районе или квартале.
    patterns:
      - all:
          - [магистрал, район, квартал, микрорайон, сет, город]
          - [аварий, авария, отключ, нет, порыв, раскопа, ремонт сет]

  - code: other.unspecified
    product_category: other
    dedupe_scope: house
    label: проблема
    description: Проблема дома, подтип которой не определён.
    patterns: []
