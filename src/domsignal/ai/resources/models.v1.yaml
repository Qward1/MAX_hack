version: v1
selected_at: '2026-09-20'
updated_at: '2026-09-23'
note: 'Выбор модели сделан на синтетических окнах (P2, 20.09). Профиль по умолчанию
  обновлён по измерениям P6 (23.09, dev D3 — синтетика): reasoning minimal, промпт
  window.v2, явная маршрутизация flex → обычный уровень, таймаут p99 + запас. Решение
  о включении LLM-слоя пассивного режима — docs/decisions.md (P6).'
default: openai/gpt-5-mini
models:
- id: openai/gpt-5-mini
  label: GPT-5 mini
  role: default
  schema_mode: json_schema_strict
  max_tokens: 1600
  # p99 на dev D3 = 20,6 с (P6, 23.09) + запас; не больше 60 с (значение production).
  timeout_seconds: 30.0
  temperature: null
  prompt: window.v2
  extra_body:
    reasoning:
      effort: minimal
    provider:
      order:
      - openai/flex
      - openai
      allow_fallbacks: true
  # P6b (24.09): окна при открытом в доме сигнале об опасности — reasoning low
  # и промпт window.v3. Набор настройки open_danger_dev: новый вид отдельным
  # сигналом 5/10 (v2, minimal) -> 10/10, продолжения без чужого вида 10/10;
  # d5_dev без регрессии. Контроль (D5, holdout) не прогонялся.
  open_danger_extra_body:
    reasoning:
      effort: low
  upstream: 'openai/flex первым (14,75 / 117,99 ₽ за млн токенов входа/выхода), при
    отказе — openai обычного уровня (29,50 / 235,98 ₽); без явного выбора polza 23.09
    направляла запросы на обычный уровень — вдвое дороже, чем при отборе 20.09'
  stores_data_in_russia: false
  policy_basis: 'polza «Конфиденциальность»: запросы у агрегатора не сохраняются,
    OpenAI хранит до 30 дней; в список «могут использовать данные для обучения» не
    входит.'
  policy_checked_at: '2026-09-20'
  measured:
    measured_at: '2026-09-23'
    dataset: D3 dev (синтетика, 138 окон), evaluation/reports/2026-09-23-p6-evaluation.md
    windows: 138
    valid_json: 1.0
    fabricated_quotes: 0.11
    p50_ms: 5493
    p95_ms: 8066
    p99_ms: 20604
