    - когда починят
    - когда почин
    - когда сдела
    - когда исправ
    - когда включ
    - когда дадут
    - есть новости
    - что там с
    - долго еще
    - долго ещё
    - кто-нибудь звонил
    - кто нибудь звонил
    - заявку подавал
    - заявку приняли
    - приняли
    - вызвали кого
    - какие новости
    - что по
  resolved_claim:
    - починили
    - почин
    - дали воду
    - дали свет
    - воду дали
    - свет дали
    - сделали
    - вывезли
    - убрали
    - заработал
    - поехал
    - уже работает
    - все ок
    - все хорошо
    - исправили
    - наладили
    - включили
  announcement:
    - уважаемые
    - по графику
    - планов
    - профилактик
    - собрание
    - будет отключ
    - будет отключен
    - отключат
    - объявлени
    - уведомля
    - предупрежда
    - информируем
    - доводим до сведения
  me_too:
