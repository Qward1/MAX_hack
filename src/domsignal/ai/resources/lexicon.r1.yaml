# Лексикон правил, редакция r1: роли реплик, recall-гейт, предварительная
# территория (location_scope) и вспомогательные маркеры.
#
# Здесь НЕТ организаций, каналов, телефонов, сроков и текстов инструкций
# безопасности: правила отвечают только на вопросы «что», «где», «когда»,
# «наблюдение ли это» и «сейчас ли». Лексикон опасности намеренно живёт в
# коде (`domsignal.ai.rules.danger`), чтобы приём webhook не зависел от
# чтения файла ресурсов.
#
# Все основы сравниваются только с начала слова после лёгкой нормализации
# (casefold, ё→е, схлопывание пробелов, транслит, повторы букв).
version: r1

# Основы, для которых разрешено нечёткое сравнение (расстояние ≤ 1,
# длина ≥ 4): опечатки вида «лфит», «рабоатет», «домофн», «мусар».
fuzzy_stems:
  - лифт
  - кабин
  - подъемник
  - работа
  - вода
  - воды
  - горяч
  - свет
  - лампоч
  - освещен
  - мусор
  - контейнер
  - мусоропровод
  - домофон
  - батаре
  - отоплен
  - подъезд
  - фонар
  - труба
  - протеч

# Глаголы и конструкции поломки — независимый признак recall-гейта (E0b).
break_markers:
  - не работа
  - не рабо
  - сломал
  - сломан
  - не еде
  - не ездит
  - не закрыва
  - не откры
  - течет
  - течь
  - протеч
  - капает
  - забит
  - засор
  - не горит
  - не горят
  - не выво
  - не вывез
  - не убира
  - не чист
  - перегорел
  - застрял
  - разбит
  - оборвал
  - не вклю
  - не реагир
  - не вызыв
  - мигает
  - гудит
  - дергает
  - слабый напор
  - отвалил
  - обрушил
  - прорвал

# Маркеры жалобы — независимый признак recall-гейта.
complaint_markers:
  - опять
  - снова
  - третий день
  - второй день
  - вторые сутки
  - вторую неделю
  - сколько можно
  - задолбал
  - когда же
  - уже неделю
  - уже месяц
  - до сих пор
  - никто не
  - что за дом
  - невозможно

# Конструкции отсутствия — независимый признак recall-гейта.
absence_markers:
  - нет
  - нету
  - без
  - отсутств

# Отрицание рядом с маркером отменяет его срабатывание.
negation_tokens:
  - не
  - нет
  - ни
  - никто
  - никого
  - ничего
  - без

roles:
