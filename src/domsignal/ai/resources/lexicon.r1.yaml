    - продам
    - продаю
    - куплю
    - отдам
    - спасибо
    - посоветуйте
    - кто потерял
    - нашлись
    - ахах
    - с днем рождения
    - с днём рождения
    - поздравля
    - в личку
    - субботник

# Маркеры «не здесь / не сейчас»: смещённое упоминание проблемы.
displaced_markers:
  - в соседнем доме
  - соседнем доме
  - в другом доме
  - в новостях
  - по новостям
  - по телевизору
  - у мамы
  - у родителей
  - у сестры
  - у брата
  - у знакомых
  - в прошлом году
  - в прошлый раз
  - на прошлой неделе
  - месяц назад
  - год назад
  - вчера было
  - позавчера
  - в другом районе
  - помните

# Длительность рядом с «отключили» — признак планового объявления,
# а не сообщения о проблеме («просто отключили газ на день»).
planned_duration_markers:
  - на день
  - на сутки
  - на час
  - на два часа
  - до вечера
  - до обеда
  - до завтра
  - до понедельника
  - на время работ

# Короткий ответ, состоящий только из места или времени.
more_info_markers:
  - в перв
  - во втор
  - в трет
  - в четверт
  - в пят
  - в шест
  - с утра
  - с вечера
  - с обеда
  - с ночи
  - со вчера
  - с выходных
  - в каком подъезде
  - на каком этаже
  - а в

# Предварительная территория. Проверяется сверху вниз, первая подошедшая
# группа побеждает. Это наблюдение о месте, а НЕ ответственность.
location_scope:
  - value: other_building
    markers:
      - в соседнем доме
      - соседнем доме
      - в другом доме
      - в соседнем подъезде дома
      - через дорогу дом
  - value: external_network
    markers:
      - во всем районе
      - во всём районе
      - весь район
      - всему району
      - в районе
      - на магистрал
      - магистрал
      - на сетях
      - в микрорайоне
      - по всему городу
      - в городе авария
  - value: municipal_territory
    markers:
      - на улице
      - у остановки
      - на остановке
      - на дороге
      - на проспекте
      - в парке
      - в сквере
      - на тротуаре
      - вдоль дороги
      - у въезда во двор
      - на переходе
      - на бульваре
      - на шоссе
  - value: apartment
    markers:
      - в квартире
      - в моей квартире
      - у меня в ванной
      - у меня в кухне
      - у меня дома
      - в ванной
      - на кухне
      - в моей комнате
      - в туалете
  - value: house_territory
