services:
  db:
    image: postgres:16.10-bookworm
    environment:
      POSTGRES_DB: domsignal
      POSTGRES_USER: domsignal
      POSTGRES_PASSWORD: domsignal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U domsignal -d domsignal"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data

  migrate:
    build:
      context: .
      target: runtime
    image: domsignal-backend:local
    command: ["alembic", "upgrade", "head"]
    environment: &backend-environment
      APP_ENV: local
      DATABASE_URL: postgresql+asyncpg://domsignal:domsignal@db:5432/domsignal
      SESSION_SECRET: local-only-change-me
      ALLOW_TEST_SESSION: "true"
      DEMO_SEED: "true"
      MAX_TRANSPORT: "off"
      LLM_PROVIDER: rules
      # Пассивное чтение чата выключено, пока его не включат явно. Локальный
      # стенд показа закрывает окно после 20 секунд тишины, а не 120.
      PASSIVE_CAPTURE_ENABLED: ${PASSIVE_CAPTURE_ENABLED:-false}
      # Модель в разборе окон чата; false — правила (явный путь не меняется).
      PASSIVE_LLM_ENABLED: ${PASSIVE_LLM_ENABLED:-true}
      PASSIVE_WINDOW_SILENCE_SECONDS: ${PASSIVE_WINDOW_SILENCE_SECONDS:-20}
      # Склейка опасности, пауза памятки и сторож разбора окна — настройки стенда.
      PASSIVE_DANGER_GROUP_MINUTES: ${PASSIVE_DANGER_GROUP_MINUTES:-30}
      PASSIVE_CHAT_MEMO_PAUSE_MINUTES: ${PASSIVE_CHAT_MEMO_PAUSE_MINUTES:-30}
      PASSIVE_ANALYSIS_FALLBACK_SECONDS: ${PASSIVE_ANALYSIS_FALLBACK_SECONDS:-90}
      DISPLAY_TIMEZONE: ${DISPLAY_TIMEZONE:-Europe/Moscow}
      # D5: пул соединений на процесс; процессы × (размер + запас) ≤ max_connections.
      DB_POOL_SIZE: ${DB_POOL_SIZE:-5}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-10}
      PUBLIC_BASE_URL: http://localhost:${API_PORT:-8000}
      CORS_ORIGINS: http://localhost:5173,http://localhost:${API_PORT:-8000}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  seed:
    image: domsignal-backend:local
    pull_policy: never
    command: ["python", "-m", "domsignal.tools.seed_demo"]
    environment: *backend-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  api:
    image: domsignal-backend:local
    pull_policy: never
    environment:
      <<: *backend-environment
      BUILD_COMMIT: ${BUILD_COMMIT:-dev}
    depends_on:
      db:
        condition: service_healthy
      seed:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    restart: unless-stopped

  worker:
    image: domsignal-backend:local
    pull_policy: never
    command: ["python", "-m", "domsignal.worker.main", "--pool", "operational"]
    environment:
      <<: *backend-environment
      # `/version` личного бота отвечает из операционного пула (D1).
      BUILD_COMMIT: ${BUILD_COMMIT:-dev}
      # D5: параллельные циклы операционного пула в процессе.
      OPERATIONAL_WORKER_CONCURRENCY: ${OPERATIONAL_WORKER_CONCURRENCY:-1}
    depends_on:
      db:
        condition: service_healthy
      seed:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      disable: true

  # Нагрузка модели изолирована: её отказ не задерживает доставку уведомлений и
  # жизненный цикл заявки, которые остаются в операционном пуле. Предохранитель
  # и семафор провайдера живут в процессе; параллельный разбор — циклы внутри
  # процесса (AI_WORKER_CONCURRENCY ≤ LLM_MAX_CONCURRENCY) или ещё процессы
  # (`--scale ai-worker=N`), бюджет общий в PostgreSQL. Остановка ждёт конца
  # начатого вызова модели.
  ai-worker:
    image: domsignal-backend:local
    pull_policy: never
    command: ["python", "-m", "domsignal.worker.main", "--pool", "ai"]
    stop_grace_period: 45s
    environment:
      <<: *backend-environment
      # Провайдер модели (M1): Cloud.ru; локально модель выключена (rules).
      LLM_BASE_URL: ${LLM_BASE_URL:-https://foundation-models.api.cloud.ru/v1}
      AI_WORKER_CONCURRENCY: ${AI_WORKER_CONCURRENCY:-1}
    depends_on:
      db:
        condition: service_healthy
      seed:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      disable: true

volumes:
  postgres-data:
