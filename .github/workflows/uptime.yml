# Внешняя проверка production на период проверки жюри (D4, аудит №13).
#
# /ready отвечает 200, /version — 200 с полем commit, webhook без секрета — 401.
# Падение job — письмо GitHub владельцу расписания и оповещения ниже; адрес
# production можно заменить переменной репозитория DOMSIGNAL_URL без правки кода.
#
# Оповещение на почту: адреса — переменная репозитория ALERT_EMAIL (несколько —
# через запятую), ящик отправителя — переменная ALERT_SMTP_USER, его пароль для
# внешних приложений — секрет ALERT_SMTP_PASSWORD; сервер — переменная
# ALERT_SMTP_HOST (по умолчанию smtp.mail.ru, порт 465). Меняются в Settings →
# Secrets and variables → Actions. Оповещение в MAX — секреты
# ALERT_MAX_BOT_TOKEN и ALERT_MAX_USER_ID (личка с начатым диалогом с ботом).
# Ручной запуск с test_alert проверяет доставку оповещений.
#
# Расписание (UTC): до сдачи — раз в час, в день сдачи — раз в 30 минут, в
# период проверки жюри 1–14.10 — раз в 15 минут, до финала 29.10 — раз в час.
#
# F1 §5.5: раз в сутки (08:41 МСК) до 29.10 job «showcase» проверяет витрину
# жюри (`scripts/showcase_check.py`: УК «Пилотная, 7» активна, квота, демо-чат
# подключён и читается, открытый доступ, проверочные аккаунты) по секрету
# SHOWCASE_CHECK_TOKEN и при нарушении открывает issue. Восстановление —
# docs/RELEASE.md, «Витрина жюри».
name: Production uptime

on:
  schedule:
    - cron: "7 * 26-29 9 *"
    - cron: "*/30 * 30 9 *"
    - cron: "*/15 * 1-14 10 *"
    - cron: "7 * 15-29 10 *"
    - cron: "41 5 28-30 9 *"
    - cron: "41 5 1-29 10 *"
  workflow_dispatch:
    inputs:
      test_alert:
        description: "Сбой для проверки оповещений"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: production-uptime
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      URL: ${{ vars.DOMSIGNAL_URL || 'https://domsignal.176-108-244-168.sslip.io' }}
      ALERT_MAX_BOT_TOKEN: ${{ secrets.ALERT_MAX_BOT_TOKEN }}
      ALERT_MAX_USER_ID: ${{ secrets.ALERT_MAX_USER_ID }}
      ALERT_EMAIL: ${{ vars.ALERT_EMAIL }}
      ALERT_SMTP_HOST: ${{ vars.ALERT_SMTP_HOST || 'smtp.mail.ru' }}
      ALERT_SMTP_USER: ${{ vars.ALERT_SMTP_USER }}
      ALERT_SMTP_PASSWORD: ${{ secrets.ALERT_SMTP_PASSWORD }}
    steps:
      - name: Forced failure for the alert test
        if: inputs.test_alert
        run: |
          echo "test_alert: оповещения проверяются вручную"
          exit 1
      - name: /ready is 200
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' --retry 2 --retry-all-errors --max-time 20 "$URL/ready")
          echo "ready: $code"
          test "$code" = "200"
      - name: /version answers with the build commit
        run: |
          body=$(curl -sf --retry 2 --retry-all-errors --max-time 20 "$URL/version")
          echo "$body"
          echo "$body" | python3 -c 'import json,sys; assert json.load(sys.stdin)["commit"]'
      - name: webhook without the secret is 401
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 -X POST -H 'content-type: application/json' -d '{}' "$URL/max/webhook")
          echo "webhook: $code"
          test "$code" = "401"
      - name: Alert by e-mail
        if: failure() && env.ALERT_EMAIL != '' && env.ALERT_SMTP_USER != '' && env.ALERT_SMTP_PASSWORD != ''
        run: |
          python3 - <<'PY'
          import os, smtplib, ssl
          from datetime import UTC, datetime
          from email.message import EmailMessage

          env = os.environ
          log = f"{env['GITHUB_SERVER_URL']}/{env['GITHUB_REPOSITORY']}/actions/runs/{env['GITHUB_RUN_ID']}"
          message = EmailMessage()
          message["Subject"] = "ДомСигнал: проверка production не прошла"
          message["From"] = env["ALERT_SMTP_USER"]
          message["To"] = env["ALERT_EMAIL"]
          message.set_content(
              f"Проверка {env['URL']} не прошла {datetime.now(UTC):%d.%m %H:%M} UTC.\n"
              f"Журнал: {log}\n"
          )
          context = ssl.create_default_context()
          with smtplib.SMTP_SSL(env["ALERT_SMTP_HOST"], 465, context=context, timeout=30) as smtp:
              smtp.login(env["ALERT_SMTP_USER"], env["ALERT_SMTP_PASSWORD"])
              smtp.send_message(message)
          print("mail alert: sent")
          PY
      - name: Alert in MAX
        if: failure() && env.ALERT_MAX_BOT_TOKEN != '' && env.ALERT_MAX_USER_ID != ''
        run: |
          text="ДомСигнал: проверка $URL не прошла $(date -u '+%d.%m %H:%M UTC'). Журнал: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          python3 - "$text" > payload.json <<'PY'
          import json, sys
          print(json.dumps({"text": sys.argv[1]}))
          PY
          curl -s -o /dev/null -w 'max alert: %{http_code}\n' --max-time 20 -X POST \
            -H "Authorization: $ALERT_MAX_BOT_TOKEN" -H 'content-type: application/json' \
            --data @payload.json "https://platform-api2.max.ru/messages?user_id=$ALERT_MAX_USER_ID"

  showcase:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.schedule == '41 5 28-30 9 *' ||
      github.event.schedule == '41 5 1-29 10 *'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    env:
      SHOWCASE_URL: ${{ vars.DOMSIGNAL_URL || 'https://domsignal.176-108-244-168.sslip.io' }}
      SHOWCASE_CHECK_TOKEN: ${{ secrets.SHOWCASE_CHECK_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Showcase invariants
        run: python3 scripts/showcase_check.py
      - name: Open an issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Витрина жюри: нарушен инвариант"
          open=$(gh issue list --state open --search "$title in:title" --json number --jq 'length')
          log="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          if [ "$open" = "0" ]; then
            gh issue create --title "$title" --body "Самопроверка витрины не прошла $(date -u '+%d.%m %H:%M UTC'). Журнал: $log. Восстановление — docs/RELEASE.md, «Витрина жюри»."
          else
            echo "issue уже открыт"
          fi
