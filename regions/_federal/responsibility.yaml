      source_title: "Платформа обратной связи «Госуслуги. Решаем вместе», pos.gosuslugi.ru/landing — «Сообщить о проблеме» и раздел «Как это работает». Проверено без входа 23.09.2026"
      source_url: https://pos.gosuslugi.ru/landing/
