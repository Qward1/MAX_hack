channels:
  # «Госуслуги. Решаем вместе» (Платформа обратной связи). Правило владельца
  # (P7a): нормы — из официальной публикации закона, свойства сервиса — со
  # страницы самого сервиса без входа. Сверено DEV-B 23.09.2026; скриншоты
  # основанием не считаются. Не подтверждено без входа и убрано из карточки:
  # «до 10 файлов по 10 МБ» (Правила подачи, п. 6, лимита не называют).
  # `unavailable_regions: RU-MOW` — по данным владельца, 20.09.2026: на
  # публичной странице не подтверждено; поле только скрывает канал для домов
  # Москвы и жителю текстом не показывается.
  # `url` — публичный адрес кнопок «Написать» и «Сообщить о проблеме» со
  # страницы pos.gosuslugi.ru/landing; без входа ведёт на вход в Госуслуги.
  # Владелец подтвердил 23.09.2026 с телефона: после входа открывается
  # сценарий «Сообщите, что вас волнует». Только с этим адресом кнопка
  # «Открыть Госуслуги» в карточке и черновике активна.
  - id: pos_gosuslugi
    organization_id: null
    channel_type: official_web
    label: Госуслуги. Решаем вместе
    url: https://www.gosuslugi.ru/help/obratitsya_v_pos
    phone: null
    entry_hint: Госуслуги → «Сообщите, что вас волнует»
    routes_to_competent_authority: true
    facts:
      - text: "Сообщение «рассмотрит профильный орган власти или администрация муниципалитета, отвечающие за решение этих вопросов»; если вопрос не в их компетенции, его перенаправят."
        source_title: "Платформа обратной связи «Госуслуги. Решаем вместе», pos.gosuslugi.ru/landing — раздел «Как это работает»; Правила подачи сообщений и обращений, п. 9. Проверено без входа 23.09.2026"
        source_url: https://pos.gosuslugi.ru/landing/
      - text: "Ответ и уведомления о ходе рассмотрения приходят в личный кабинет на Госуслугах и на электронную почту из профиля."
        source_title: "Правила подачи сообщений и обращений, п. 10 — документ по ссылке со страницы pos.gosuslugi.ru/landing. Проверено без входа 23.09.2026"
        source_url: https://gu-st.ru/content/Rules_for_sending_messages1.pdf
      - text: "По закону письменное обращение «рассматривается в течение 30 дней со дня регистрации письменного обращения»; в исключительных случаях срок могут продлить «не более чем на 30 дней», уведомив гражданина."
        source_title: "Федеральный закон от 02.05.2006 № 59-ФЗ «О порядке рассмотрения обращений граждан Российской Федерации», ст. 12 ч. 1 и 2 (действующая редакция, pravo.gov.ru). Проверено 23.09.2026"
        source_url: http://pravo.gov.ru/proxy/ips/?docbody=&nd=102106413
      - text: "Рекомендуется писать об одной проблеме в одном сообщении; о нескольких вопросах — отдельно по каждому."
        source_title: "Правила подачи сообщений и обращений, п. 5; pos.gosuslugi.ru/landing — «Правила подачи сообщений и обращений». Проверено без входа 23.09.2026"
        source_url: https://gu-st.ru/content/Rules_for_sending_messages1.pdf
      - text: "Для подачи нужна подтверждённая учётная запись на Госуслугах."
        source_title: "Правила подачи сообщений и обращений, п. 3 — документ по ссылке со страницы pos.gosuslugi.ru/landing. Проверено без входа 23.09.2026"
        source_url: https://gu-st.ru/content/Rules_for_sending_messages1.pdf
    unavailable_regions:
