rules:
  # Совпадает и по подтипу, и по виду опасности: предварительный сигнал о газе
  # до разбора окна подтипа ещё не имеет, но маршрут уже экстренный. Другие
  # виды опасности, кроме газа и дыма/огня, правил не получают — опасность
  # ортогональна маршруту.
  - id: federal.gas_smell.emergency
    priority: 10
    match:
      subtypes:
        - gas.smell
      danger_kinds:
        - gas
      location_scopes: []
    route_type: emergency_service
    organization_id: null
    channel_ids:
      - emergency_112
    can_prepare_appeal: false
    basis:
      text: Запах газа — повод вызвать экстренные службы, а не завести обычную заявку; вызов принимает единый номер 112.
      source_title: Федеральный закон от 30.12.2020 № 488-ФЗ «Об обеспечении вызова экстренных оперативных служб по единому номеру "112"…»
      source_url: http://publication.pravo.gov.ru/Document/View/0001202012300005
    verification:
      status: verified
      verified_at: "2026-09-20"
      verified_by: владелец (текст федерального закона)
      source_title: Федеральный закон от 30.12.2020 № 488-ФЗ «Об обеспечении вызова экстренных оперативных служб по единому номеру "112"…»
      source_url: http://publication.pravo.gov.ru/Document/View/0001202012300005

  # Дым или огонь ведут в 112 только по виду опасности: подтипа пожара в
  # таксономии нет. В 488-ФЗ пожарная охрана прямо не названа — основание
  # взято из Правил, утверждённых по ст. 6 ч. 1 п. 6 этого закона.
  - id: federal.smoke_fire.emergency
    priority: 10
    match:
      subtypes: []
      danger_kinds:
        - smoke_fire
      location_scopes: []
    route_type: emergency_service
    organization_id: null
    channel_ids:
      - emergency_112
    can_prepare_appeal: false
    basis:
      text: "При вызове по 112 пожарную охрану привлекают по п. 21 «а» Правил взаимодействия сил и средств систем обеспечения вызова экстренных оперативных служб по единому номеру «112»: «привлечение службы пожарной охраны осуществляется при наличии открытых или закрытых очагов пожара, сильного задымления, необходимости эвакуации людей с верхних этажей зданий, угрозы чрезвычайной ситуации или происшествия, следствием которых может стать пожар»."
      source_title: Постановление Правительства РФ от 27.11.2021 № 2071 «Об утверждении Правил взаимодействия сил и средств систем обеспечения вызова экстренных оперативных служб по единому номеру "112"», п. 21 «а» Правил; официальное опубликование 30.11.2021, 0001202111300024
      source_url: http://publication.pravo.gov.ru/document/0001202111300024
    verification:
      status: verified
      verified_at: "2026-09-23"
      verified_by: DEV-B (текст официальной публикации, PDF publication.pravo.gov.ru)
      source_title: Постановление Правительства РФ от 27.11.2021 № 2071, п. 21 «а» Правил; официальное опубликование 30.11.2021, 0001202111300024
      source_url: http://publication.pravo.gov.ru/document/0001202111300024

  # Угроза обрушения и иная опасность для жизни и здоровья ведут в 112 по
  # тем же Правилам, что и дым (п. 21 «б» и «г»), — только по виду опасности.
  - id: federal.structural.emergency
    priority: 10
    match:
      subtypes: []
      danger_kinds:
        - structural
      location_scopes: []
    route_type: emergency_service
    organization_id: null
    channel_ids:
      - emergency_112
    can_prepare_appeal: false
    basis:
      text: "При вызове по 112 службу реагирования в чрезвычайных ситуациях привлекают по п. 21 «б» Правил: «привлечение службы реагирования в чрезвычайных ситуациях осуществляется при необходимости проведения аварийно-спасательных работ, а также угрозе чрезвычайной ситуации или происшествия, в результате которых может потребоваться проведение таких работ»."
      source_title: "Постановление Правительства РФ от 27.11.2021 № 2071 «Об утверждении Правил взаимодействия сил и средств систем обеспечения вызова экстренных оперативных служб по единому номеру \"112\"», п. 21 «б» Правил; официальное опубликование 30.11.2021, 0001202111300024"
      source_url: http://publication.pravo.gov.ru/document/0001202111300024
    verification:
      status: verified
      verified_at: "2026-09-23"
      verified_by: DEV-B (текст официальной публикации, PDF publication.pravo.gov.ru, с. 8)
      source_title: "Постановление Правительства РФ от 27.11.2021 № 2071 «Об утверждении Правил взаимодействия сил и средств систем обеспечения вызова экстренных оперативных служб по единому номеру \"112\"», п. 21 «б» Правил; официальное опубликование 30.11.2021, 0001202111300024"
      source_url: http://publication.pravo.gov.ru/document/0001202111300024

