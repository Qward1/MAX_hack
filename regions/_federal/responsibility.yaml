      source_title: "Постановление Правительства РФ от 27.11.2021 № 2071 «Об утверждении Правил взаимодействия сил и средств систем обеспечения вызова экстренных оперативных служб по единому номеру \"112\"», п. 21 «г» Правил; официальное опубликование 30.11.2021, 0001202111300024"
      source_url: http://publication.pravo.gov.ru/document/0001202111300024
    verification:
      status: verified
      verified_at: "2026-09-23"
      verified_by: DEV-B (текст официальной публикации, PDF publication.pravo.gov.ru, с. 9)
      source_title: "Постановление Правительства РФ от 27.11.2021 № 2071 «Об утверждении Правил взаимодействия сил и средств систем обеспечения вызова экстренных оперативных служб по единому номеру \"112\"», п. 21 «г» Правил; официальное опубликование 30.11.2021, 0001202111300024"
      source_url: http://publication.pravo.gov.ru/document/0001202111300024

  - id: federal.municipal_territory.default
