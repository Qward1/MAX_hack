# Региональный слой справочника ответственности: город Москва (D2).
#
# Второй регион — данными, не кодом (REGION-MOW-2026-09-26). Федеральный канал
# «Госуслуги. Решаем вместе» помечен `unavailable_regions: RU-MOW`, поэтому
# в Москве роутер его не предлагает; тот же подтип получает московский канал —
# портал «Наш город». Валидатор `scripts/validate_region_pack.py` не даёт этому
# слою сослаться на канал, недоступный в RU-MOW.
#
# Источники прочитаны 24.09.2026 без входа: gorod.mos.ru/portal/about и
# gorod.mos.ru/themes (с сервера в РФ — с зарубежного адреса портал не
# открывается), mos.ru/news/item/97753073/. Темы портала процитированы
# дословно. Сроков ответа справочник не утверждает: нормативного документа с
# ними мы не открывали. Органов и телефонов без источника здесь нет.
