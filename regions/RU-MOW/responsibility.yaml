      - text: "Для подачи нужна учётная запись mos.ru: «Нажмите на кнопку «Войти через mos.ru». На следующем этапе – вводите пароль и логин от портала mos.ru»."
        source_title: "Портал «Наш город», gorod.mos.ru/portal/about — «Как стать пользователем?». Проверено без входа 24.09.2026"
        source_url: https://gorod.mos.ru/portal/about
